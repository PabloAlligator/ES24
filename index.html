<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f3" />
    <link rel="stylesheet" href="site/css/main.min.css" />
    <title>Enduro Siberia 24 — Regulmoto Legend 300</title>
  </head>

  <body>
    <main class="page">
      <section class="hero">
        <div class="hero-rail" aria-hidden="true">
          <ol class="hero-rail__pages">
            <li class="hero-rail__page hero-rail__page--active">01</li>
            <li class="hero-rail__page">02</li>
            <li class="hero-rail__page">03</li>
          </ol>

          <div class="hero-rail__labels">
            <span>ЛЕС</span>
            <span>ГОРЫ</span>
            <span>ГРЯЗЬ</span>
            <span>СВОБОДА</span>
          </div>
        </div>

        <div class="hero-content">
          <h1 class="hero-content__title">
            <span class="hero-brand">REGULMOTO</span>

            <span class="hero-model">
              <span class="hero-model__name">LEGEND</span>
              <span class="hero-model__detail">300</span>
            </span>
          </h1>

          <p class="hero-slogan">
            СОЗДАН<br />
            ДЛЯ БЕЗДОРОЖЬЯ.<br />
            РОЖДЕН<br />
            ДЛЯ СВОБОДЫ.
          </p>

          <div class="hero-content__actions">
            <button class="primary" type="button">
              <span>УТОЧНИТЬ НАЛИЧИЕ</span>
              <svg viewBox="0 0 24 18" aria-hidden="true">
                <path
                  d="M2 8h15.5l-4.5-4.5L14.5 2 22 9l-7.5 7-1.5-1.5 4.5-4.5H2V8Z"
                />
              </svg>
            </button>

            <button class="podobrat" type="button">
              <span>ПОДОБРАТЬ КОМПЛЕКТАЦИЮ</span>
            </button>
          </div>

          <div class="hero-adventages" aria-label="Характеристики мотоцикла">
            <div class="hero-adventages__block">
              <svg
                class="hero-adventages__icon"
                viewBox="0 0 48 48"
                aria-hidden="true"
              >
                <path d="M11 17h25l4 6v12H8V23l3-6Z" />
                <path
                  d="M16 17v-5h6v5M27 17v-5h6v5M14 35v4M34 35v4M8 25H4M44 25h-4"
                />
              </svg>

              <p class="hero-adventages__block-text">
                <strong>300 <small>cc</small></strong>
                <span>ОБЪЕМ ДВИГАТЕЛЯ</span>
              </p>
            </div>

            <div class="hero-adventages__block">
              <svg
                class="hero-adventages__icon"
                viewBox="0 0 48 48"
                aria-hidden="true"
              >
                <path d="M29 4 13 28h12l-6 16 16-24H23L29 4Z" />
              </svg>

              <p class="hero-adventages__block-text">
                <strong>28 <small>hp</small></strong>
                <span>МОЩНОСТЬ</span>
              </p>
            </div>

            <div class="hero-adventages__block">
              <svg
                class="hero-adventages__icon"
                viewBox="0 0 48 48"
                aria-hidden="true"
              >
                <circle cx="24" cy="24" r="15" />
                <circle cx="24" cy="24" r="5" />
                <path
                  d="M24 9v10m0 10v10M9 24h10m10 0h10M14 14l7 7m6 6 7 7m0-20-7 7m-6 6-7 7"
                />
              </svg>

              <p class="hero-adventages__block-text">
                <strong>21 / 18</strong>
                <span>КОЛЕСА<br />ДЛЯ БЕЗДОРОЖЬЯ</span>
              </p>
            </div>

            <div class="hero-adventages__block">
              <svg
                class="hero-adventages__icon"
                viewBox="0 0 48 48"
                aria-hidden="true"
              >
                <path d="M13 7h18l5 5v29H13V7Z" />
                <path d="M31 7v7h7M18 22h13M18 28h13M18 34h8" />
              </svg>

              <p class="hero-adventages__block-text">
                <strong>ПТС</strong>
                <span>В НАЛИЧИИ</span>
              </p>
            </div>
          </div>

          <div class="hero-obzor">
            <a class="hero-obzor__button" href="#">
              <span class="hero-obzor__icon">
                <svg viewBox="0 0 14 16" aria-hidden="true">
                  <path d="M13 8L1 15V1L13 8Z" />
                </svg>
              </span>

              <span class="hero-obzor__button-text">
                СМОТРЕТЬ
                <span>ОБЗОР</span>
              </span>
            </a>

            <div class="hero-obzor__gallery" aria-hidden="true">
              <span class="hero-obzor__image hero-obzor__image--front">
                <img src="site/img/mot.png" alt="" />
              </span>

              <span class="hero-obzor__image hero-obzor__image--middle">
                <img src="site/img/mot.png" alt="" />
              </span>

              <span class="hero-obzor__image hero-obzor__image--rear">
                <img src="site/img/mot.png" alt="" />
              </span>
            </div>

            <p class="hero-obzor__caption">
              РЕАЛЬНЫЕ УСЛОВИЯ
              <span>РЕАЛЬНЫЕ ЭМОЦИИ</span>
            </p>
          </div>
        </div>

        <div class="hero-backdrop" aria-hidden="true">
          <div class="hero-backdrop__mountains"></div>

          <div class="hero-backdrop__right">
            <div class="hero-backdrop__slash hero-backdrop__slash--black"></div>
            <div class="hero-backdrop__slash hero-backdrop__slash--acid"></div>
            <!-- <div class="hero-backdrop__slash hero-backdrop__slash--white"></div> -->

            <div class="hero-backdrop__mountain-panel"></div>

            <div class="hero-backdrop__rider-panel">
              <img class="hero-backdrop__rider-image" src="site/img/rider.png" alt="" />
            </div>

            <div class="hero-backdrop__lower-cut"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="site/js/main.js"></script>
  </body>
</html>
